name: liftlab
description: 练伴 · AI 私教与训练记录
publish_to: 'none'
version: 0.5.1+8
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  file_picker: ^10.0.0
  camera: ^0.11.0
  camera_android: ^0.10.0
  flutter_tts: ^4.2.0
  google_mlkit_pose_detection: ^0.14.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: 22.3.2
  timezone: ^0.11.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  fluwx: ^6.0.6
  crypto: ^3.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: LianbanSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
  assets:
    - assets/coach/chibi/
    - assets/fonts/OFL.txt
